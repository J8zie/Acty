
@if (service.current(); as c) {
  <div class="backdrop" data-lenis-prevent data-testid="confirm-backdrop" (click)="cancel()">
    <div
      #panel
      class="panel"
      [class.danger]="c.tone === 'danger'"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      [attr.aria-describedby]="c.message ? 'confirm-message' : null"
      data-testid="confirm-dialog"
      (click)="$event.stopPropagation()"
      (keydown)="onKey($event)"
    >
      <h2 id="confirm-title" class="text-title">{{ c.title }}</h2>
      @if (c.message) {
        <p id="confirm-message" class="mt-3 opacity-80">{{ c.message }}</p>
      }
      @if (c.details?.length) {
        <ul class="label mt-4 grid gap-1 opacity-70">
          @for (d of c.details; track d) {
            <li>{{ d }}</li>
          }
        </ul>
      }
      @if (c.password; as p) {
        <label class="field mt-6">
          <span class="label">{{ p.label || 'Your password' }}</span>
          <input
            class="input"
            type="password"
            autocomplete="current-password"
            data-testid="confirm-password"
            [attr.aria-invalid]="passwordMissing() ? 'true' : null"
            [value]="password()"
            (input)="onPasswordInput($event)"
            (keydown.enter)="ok()"
          />
          @if (passwordMissing()) {
            <span class="error-text" role="alert">Enter your password to continue.</span>
          } @else if (p.hint) {
            <span class="label opacity-60">{{ p.hint }}</span>
          }
        </label>
      }
      <div class="mt-8 flex flex-wrap justify-end gap-3">
        <button type="button" class="btn btn-sm" data-testid="confirm-cancel" (click)="cancel()">{{ c.cancelLabel || 'Cancel' }}</button>
        <button type="button" class="btn btn-solid btn-sm" data-testid="confirm-ok" (click)="ok()">{{ c.confirmLabel || 'Confirm' }}</button>
      </div>
    </div>
  </div>
}
