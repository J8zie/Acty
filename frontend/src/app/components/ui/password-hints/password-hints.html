
<ul class="hints label flex flex-wrap gap-x-5 gap-y-1" aria-label="Password rules" data-testid="password-hints">
  @for (c of checks(); track c.label) {
    <li [class.ok]="c.ok" [attr.data-ok]="c.ok">
      <span class="dot" aria-hidden="true"></span>{{ c.label }}<span class="sr-only">{{ c.ok ? ' (done)' : ' (missing)' }}</span>
    </li>
  }
</ul>
