

<div #host class="absolute inset-0"></div>

@if (active(); as r) {
  <div class="card absolute inset-x-3 bottom-3 z-[1100] grid gap-3 rounded-lg p-4 backdrop-blur md:right-auto md:max-w-sm" role="dialog" aria-label="Selected report">
    <div class="flex items-start justify-between gap-4">
      <p class="text-lg leading-tight font-semibold tracking-tight">{{ r.title }}</p>
      
      <button type="button" class="label -m-2 p-2 opacity-70" aria-label="Close" (click)="active.set(null)">✕</button>
    </div>
    <p class="label flex flex-wrap items-center gap-x-4 gap-y-1 opacity-80">
      <span>{{ r.barangay }}</span>
      <app-status [status]="r.status" />
    </p>
    
    <button type="button" class="btn btn-solid btn-sm w-fit" (click)="selected.emit(r.id)">Open report →</button>
  </div>
}

@if (hint()) {
  <p class="label pointer-events-none absolute top-3 left-1/2 z-[1100] -translate-x-1/2 rounded-full bg-brand-background/90 px-4 py-2 whitespace-nowrap" role="status">
    Use two fingers to move the map
  </p>
}

@if (fallback()) {
  <p class="label absolute top-3 right-3 z-[1100] rounded-full bg-brand-background/90 px-3 py-1.5" role="status">Using the free map</p>
}
